<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골라 Alpha · 실데이터 연결</title>
<style>
:root{--bg:#f6f6f3;--paper:#fff;--text:#171714;--muted:#73736d;--line:#e5e4de;--accent:#2f6b4f;--accent-soft:#edf5f0;--warn:#9a6800;--warn-soft:#fff6df;--bad:#a74444;--bad-soft:#fff0f0;--blue:#315d91;--blue-soft:#eef4fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Apple SD Gothic Neo,system-ui,sans-serif}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.nav{max-width:1180px;margin:auto;height:62px;padding:0 18px;display:flex;align-items:center;gap:26px}.logo{font-size:23px;font-weight:950;letter-spacing:-1px;color:var(--accent)}.nav a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:750}.nav a.active{color:var(--text)}.spacer{flex:1}.live{font-size:12px;color:var(--accent);font-weight:800}
main{max-width:1180px;margin:auto;padding:28px 18px 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}h1{margin:0 0 7px;font-size:30px;letter-spacing:-1.3px}.hero p{margin:0;color:var(--muted);font-size:14px}.hero strong{color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--paper);padding:8px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.search{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:220px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:13px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted)}.stat b{color:var(--text);font-size:15px;margin-right:4px}.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.card{padding:17px 18px;border-bottom:1px solid var(--line)}.card:last-child{border-bottom:0}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}.category{font-size:11px;color:var(--muted);margin-bottom:4px}.title{font-size:17px;font-weight:900;line-height:1.35;letter-spacing:-.35px}.org{font-size:12px;color:var(--muted);margin-top:4px}.deadline{text-align:right;white-space:nowrap}.deadline b{display:block;color:var(--accent);font-size:14px}.deadline span{font-size:10.5px;color:var(--muted)}.reason{margin-top:10px;font-size:12.5px;line-height:1.55;color:#494944}.bottom{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}.badge{padding:5px 7px;border-radius:6px;font-size:11px;font-weight:850}.badge.good{background:var(--accent-soft);color:var(--accent)}.badge.cond{background:var(--warn-soft);color:var(--warn)}.badge.verify{background:var(--blue-soft);color:var(--blue)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.meta{font-size:11px;color:var(--muted)}.openlink{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}
aside{display:grid;gap:12px;position:sticky;top:78px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px}.panel h3{margin:0 0 11px;font-size:14px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 9px;font-size:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:7px;font-size:11.5px;margin:7px 0}.primary{width:100%;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px;font-size:12px;font-weight:850;cursor:pointer}.secondary{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;margin-top:7px}.note{font-size:11px;line-height:1.55;color:var(--muted)}.error{background:var(--bad-soft);color:var(--bad);border:1px solid #f0cccc;padding:12px;border-radius:10px;font-size:12px;margin-bottom:10px;display:none}.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:860px){.grid{grid-template-columns:1fr}aside{position:static;order:-1;grid-template-columns:1fr 1fr}.hero{flex-direction:column;align-items:flex-start}}@media(max-width:620px){.nav a{display:none}aside{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.search{min-width:0}.top{grid-template-columns:1fr}.deadline{text-align:left}h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">골라</div><a class="active" href="#">추천</a><a href="#">공모전 찾기</a><a href="#">내 후보</a><div class="spacer"></div><div class="live">● Supabase Live Alpha</div></div></header>
<main>
<section class="hero"><div><h1>지금 지원할 수 있는 공모전</h1><p>실제 GOLLA Supabase의 <strong>활성 후보 100개</strong>를 현재 프로필로 판정합니다.</p></div></section>
<div class="grid">
<section>
<div id="error" class="error"></div>
<div class="summary"><div class="stat"><b id="countAll">-</b>전체</div><div class="stat"><b id="countEligible">-</b>지원 가능</div><div class="stat"><b id="countConditional">-</b>조건부</div><div class="stat"><b id="countVerify">-</b>정보 입력 필요</div><div class="stat"><b id="countBad">-</b>자격 불충족</div></div>
<div class="toolbar"><div class="tabs"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="eligible">지원 가능</button><button class="tab" data-filter="eligible_with_condition">조건부</button><button class="tab" data-filter="verify">입력 필요</button><button class="tab" data-filter="ineligible">자격 불충족</button></div><div class="search"><input id="search" placeholder="공모전명 · 분야 검색"></div></div>
<div id="list" class="list"><div class="empty">실데이터를 불러오는 중…</div></div>
</section>
<aside>
<div class="panel"><h3>내 조건</h3>
<div class="field"><label>학교</label><input id="school" value="인하대학교"></div>
<div class="field"><label>전공</label><input id="major" value="문화콘텐츠학과"></div>
<div class="row2"><div class="field"><label>학적</label><select id="student"><option value="university" selected>대학생</option><option value="graduate_school">대학원생</option><option value="other">기타</option></select></div><div class="field"><label>상태</label><select id="enrollment"><option value="enrolled" selected>재학</option><option value="leave_of_absence">휴학</option><option value="graduated">졸업</option></select></div></div>
<div class="row2"><div class="field"><label>국적</label><select id="nationality"><option value="">미입력</option><option value="KR">대한민국</option><option value="OTHER">기타</option></select></div><div class="field"><label>만 나이</label><input id="age" type="number" min="0" placeholder="미입력"></div></div>
<div class="row2"><div class="field"><label>참가형태</label><select id="mode"><option value="individual" selected>개인</option><option value="team">팀</option></select></div><div class="field"><label>팀 인원</label><input id="teamSize" type="number" min="1" value="1"></div></div>
<div class="field"><label>거주국</label><select id="country"><option value="KR" selected>대한민국</option><option value="OTHER">기타</option></select></div>
<div class="field"><label>지역</label><input id="region" value="Incheon"></div>
<div class="check"><input id="advisor" type="checkbox"><label for="advisor">지도교수 확보</label></div>
<div class="check"><input id="military" type="checkbox"><label for="military">군 장병</label></div>
<div class="check"><input id="published" type="checkbox"><label for="published">등단/정식 출판 작가</label></div>
<div class="check"><input id="formalHistory" type="checkbox"><label for="formalHistory">정식 연재·출판 경력 있음</label></div>
<div class="check"><input id="startupStatus" type="checkbox"><label for="startupStatus">에너지 예비창업/5년 이내 기업 요건 충족</label></div>
<div class="check"><input id="energyIdea" type="checkbox"><label for="energyIdea">에너지 창업 아이디어 보유</label></div>
<div class="check"><input id="employmentProgram" type="checkbox"><label for="employmentProgram">구직자도약보장패키지 관련 참여자</label></div>
<div class="check"><input id="asian" type="checkbox"><label for="asian">대만 제외 아시아 국적 조건 충족</label></div>
<button id="apply" class="primary">내 조건으로 다시 골라보기</button><button id="reset" class="secondary">조건 초기화</button></div>
<div class="panel"><h3>Alpha 상태</h3><div class="note">이 화면은 목업 데이터가 아니라 GOLLA Supabase의 실제 100개 후보를 읽습니다. 공식 Source와 자격규칙은 서버 DB에 저장되어 있고, 화면에서는 결정형 Eligibility Engine 결과를 표시합니다.</div><div class="note" id="updated" style="margin-top:8px"></div></div>
</aside>
</div>
</main>
<script>
const SUPABASE_URL='https://muzxdwfljfeextufqcfp.supabase.co';
const SUPABASE_KEY='sb_publishable_2myuSMJIGje-81heh2M1Lg_Vrr3QZQu';
let rows=[];let currentFilter='all';const $=id=>document.getElementById(id);
const statusMap={eligible:['지원 가능','good'],eligible_with_condition:['조건부','cond'],verify:['정보 입력 필요','verify'],ineligible:['자격 불충족','bad']};
function profile(){const p={school_name:$('school').value.trim()||undefined,major_name:$('major').value.trim()||undefined,student_level:$('student').value||undefined,enrollment_status:$('enrollment').value||undefined,participation_mode:$('mode').value||undefined,team_size:Number($('teamSize').value||1),residence_country:$('country').value||undefined,residence_region:$('region').value.trim()||undefined,advisor_available:$('advisor').checked,is_military_member:$('military').checked,is_published_author:$('published').checked,has_formal_serialization_or_publication_history:$('formalHistory').checked,eligible_energy_startup_status:$('startupStatus').checked,has_energy_startup_idea:$('energyIdea').checked,eligible_employment_growth_case_role:$('employmentProgram').checked,is_asian_national_except_tw:$('asian').checked,is_youth:false};const nat=$('nationality').value;const age=$('age').value;if(nat)p.nationality=nat;if(age)p.age=Number(age);return p}
async function load(){ $('error').style.display='none';$('list').innerHTML='<div class="empty">실데이터를 판정하는 중…</div>';try{const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/golla_evaluate_alpha_catalog`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_profile:profile()})});if(!res.ok)throw new Error(`Supabase ${res.status}: ${await res.text()}`);rows=await res.json();render();$('updated').textContent=`마지막 조회: ${new Date().toLocaleString('ko-KR')}`}catch(e){$('error').textContent='실데이터 연결 실패: '+e.message;$('error').style.display='block';$('list').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'}}
function render(){const counts={eligible:0,eligible_with_condition:0,verify:0,ineligible:0};rows.forEach(r=>counts[r.engine_status]=(counts[r.engine_status]||0)+1);$('countAll').textContent=rows.length;$('countEligible').textContent=counts.eligible||0;$('countConditional').textContent=counts.eligible_with_condition||0;$('countVerify').textContent=counts.verify||0;$('countBad').textContent=counts.ineligible||0;const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>{const f=currentFilter==='all'||r.engine_status===currentFilter;const s=!q||`${r.title} ${r.category||''} ${r.organizer||''}`.toLowerCase().includes(q);return f&&s});if(!filtered.length){$('list').innerHTML='<div class="empty">조건에 맞는 공모전이 없습니다.</div>';return}$('list').innerHTML=filtered.map(r=>{const [label,cls]=statusMap[r.engine_status]||['확인 필요','verify'];const team=r.participation_mode==='team'?`팀 ${r.team_min||''}~${r.team_max||''}인`:r.participation_mode==='both'?'개인·팀':r.participation_mode==='individual'?'개인':'참가형태 확인';const deadline=r.deadline_text||'마감 정보 없음';const source=r.authority_status==='resolved'?'공식정보 확인됨':r.authority_status==='track_split'?'트랙별 규칙':r.authority_status;const link=r.official_url?`<a class="openlink" href="${r.official_url}" target="_blank" rel="noopener">공식 공고 ↗</a>`:'';return `<article class="card"><div class="top"><div><div class="category">${escapeHtml(r.category||'기타')}</div><div class="title">${escapeHtml(r.title)}</div><div class="org">${escapeHtml(r.organizer||'주최기관 확인')}</div></div><div class="deadline"><b>${escapeHtml(deadline)}</b><span>${escapeHtml(source)}</span></div></div><div class="reason">${escapeHtml(r.candidate_reason||'구조화된 자격규칙으로 판정합니다.')}</div><div class="bottom"><span class="badge ${cls}">${label}</span><span class="meta">${team}</span>${link}</div></article>`}).join('')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;render()}));$('search').addEventListener('input',render);$('apply').addEventListener('click',load);$('reset').addEventListener('click',()=>{$('nationality').value='';$('age').value='';$('mode').value='individual';$('teamSize').value=1;['advisor','military','published','formalHistory','startupStatus','energyIdea','employmentProgram','asian'].forEach(id=>$(id).checked=false);load()});load();
</script>
</body>
</html>
